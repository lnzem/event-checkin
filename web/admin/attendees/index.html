<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Attendees — Regismeow</title>
  <script src="/web/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/web/assets/css/main.css">
  <style>
    .counters-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
    }
    @media (max-width: 639px) {
      .counters-grid { grid-template-columns: 1fr; }
    }
    .sort-btn {
      background: transparent;
      border: 0;
      padding: 0;
      font: inherit;
      font-weight: 600;
      color: inherit;
      text-transform: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .attendee-identity { display: flex; align-items: center; gap: 12px; min-width: 170px; }
    .attendee-qr {
      flex: 0 0 56px;
      width: 56px;
      height: 56px;
      padding: 3px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      image-rendering: pixelated;
    }
    .attendee-menu-floating { position: fixed; z-index: 100; }
  </style>
</head>
<body>
  <header id="admin-header"></header>

  <main class="container stack-lg" style="padding-top:24px;padding-bottom:48px;">
    <div id="attendees-root" class="stack-lg" aria-live="polite"></div>
  </main>

  <script type="module" src="/web/assets/js/pages/admin-attendees.js"></script>
  <script type="module" src="/web/assets/js/theme.js"></script>
</body>
</html>
