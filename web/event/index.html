<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Details — Regismeow</title>
  <meta name="description" content="View event details, schedule, venue, and register for your QR ticket.">
  <meta property="og:title" content="Event Details — Regismeow">
  <meta property="og:description" content="View event details, schedule, venue, and register for your QR ticket.">
  <meta property="og:type" content="website">
  <script src="/web/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/web/assets/css/main.css">
  <style>
    .cover-banner {
      position: relative;
      width: 100%;
      aspect-ratio: 1.8 / 1;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, var(--accent-soft), var(--surface-subtle) 68%);
    }
    .cover-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .event-cover-fallback {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 78% 25%, rgba(255,255,255,.28), transparent 25%), linear-gradient(135deg, var(--accent), #bd4d18);
      color: #fff;
      font-size: clamp(1.25rem, 4vw, 2.75rem);
      font-weight: 700;
      letter-spacing: .08em;
      line-height: 1.05;
    }
    .event-cover-mark { display: grid; width: 76px; height: 76px; place-items: center; border: 1px solid rgba(255,255,255,.7); border-radius: 24px; }
    .event-cover-mark svg { width: 42px; height: 42px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .event-cover-shade { position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, rgba(15,17,21,.55)); pointer-events: none; }
    .event-cover-label { position: absolute; bottom: 16px; left: 18px; color: #fff; font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-shadow: 0 1px 4px rgba(0,0,0,.4); }
    .event-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "cover" "sidebar" "content";
      gap: 20px;
      align-items: start;
    }
    .cover-banner { grid-area: cover; }
    .event-sidebar { grid-area: sidebar; background: linear-gradient(145deg, var(--accent-soft), var(--surface-subtle) 70%); border: 1px solid var(--border); border-top: 3px solid var(--accent); gap: 16px; }
    .event-sidebar h1 { margin: 0; font-size: 1.5rem; line-height: 1.25; }
    .event-status-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .event-type-pill { display: inline-flex; align-items: center; min-height: 27px; padding: 4px 9px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text-muted); font-size: .6875rem; font-weight: 600; }
    .event-meta-card { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: start; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    .event-detail-icon, .event-section-icon { display: inline-grid; width: 38px; height: 38px; flex: 0 0 auto; place-items: center; border-radius: 12px; background: var(--accent-soft); color: var(--accent-strong); }
    .event-detail-icon svg, .event-section-icon svg, .button-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .event-detail-label { display: block; margin-bottom: 3px; color: var(--text-muted); font-size: .6875rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .event-meta-value { color: var(--text); font-size: .875rem; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
    .event-meta-note { display: block; margin-top: 3px; color: var(--text-muted); font-size: .75rem; }
    .event-capacity { font-size: 0.8125rem; }
    .event-capacity-label { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
    .event-detail-icon-small { width: 30px; height: 30px; border-radius: 10px; }
    .event-detail-icon-small svg { width: 17px; height: 17px; }
    .event-spots-left { color: var(--accent-strong); font-weight: 700; }
    .event-secondary-actions { margin-top: 2px; gap: 8px; }
    .event-secondary-actions .btn { flex: 1 1 auto; }
    .button-icon { display: inline-flex; width: 17px; height: 17px; }
    .event-primary-action .btn-primary { background: var(--accent); color: var(--accent-contrast); }
    .event-primary-action .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .event-content { grid-area: content; gap: 16px; }
    .event-section-title { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 1.125rem; }
    .event-section-icon { width: 34px; height: 34px; border-radius: 11px; }
    .event-about { border-left: 3px solid var(--accent); background: linear-gradient(115deg, var(--surface), var(--accent-soft)); }
    .event-about p { margin: 0; line-height: 1.65; }
    .event-details { gap: 0; border-top: 3px solid var(--accent); }
    .event-details .event-section-title { margin-bottom: 8px; }
    .event-detail-row { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border); }
    .event-detail-row > div { display: flex; min-width: 0; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
    .event-detail-row strong { flex: 0 0 100px; font-size: .8125rem; }
    .event-detail-row > div > span { min-width: 0; color: var(--text-muted); font-size: .875rem; overflow-wrap: anywhere; }
    .event-location-name { margin: 0; color: var(--text-muted); font-size: .875rem; }
    .event-section-icon svg { width: 19px; height: 19px; }
    .event-primary-action { grid-area: action; }
    @media (min-width: 900px) {
      .event-layout {
        grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr);
        grid-template-areas: "cover sidebar" "content sidebar";
      }
      .event-sidebar { position: sticky; top: 84px; }
    }
    @media (max-width: 899px) {
      .cover-banner { aspect-ratio: 1.5 / 1; }
      .event-primary-action {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 45;
        padding: 12px 24px calc(12px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--border);
        background: var(--surface);
      }
      .has-event-action.has-mobile-nav { padding-bottom: 154px; }
    }
    @media (max-width: 420px) {
      .event-sidebar { padding: 14px; gap: 12px; }
      .event-sidebar h1 { font-size: 1.3rem; }
      .event-meta-card { grid-template-columns: 34px minmax(0, 1fr); gap: 9px; padding: 10px; }
      .event-meta-card .event-detail-icon { width: 32px; height: 32px; border-radius: 10px; }
      .event-meta-card .event-detail-icon svg { width: 17px; height: 17px; }
      .event-detail-row { grid-template-columns: 32px minmax(0, 1fr); gap: 9px; }
      .event-detail-row strong { flex-basis: 100%; }
      .event-detail-row > div { flex-direction: column; gap: 2px; align-items: flex-start; }
      .event-location-name { max-width: 100%; }
    }
    .progress-track {
      height: 8px;
      background: var(--surface-subtle);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }
    .event-map {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-subtle);
    }
    .event-map iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main class="container stack-lg" style="padding-top:24px;padding-bottom:48px;">
    <div>
      <a href="/" class="muted" style="font-weight:500;">‹ All events</a>
    </div>
    <div id="event-root" aria-live="polite"></div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="/web/assets/js/pages/event.js"></script>
  <script type="module" src="/web/assets/js/theme.js"></script>
</body>
</html>
