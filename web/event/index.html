<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Details — Live</title>
  <meta name="description" content="View event details, schedule, venue, and register for your QR ticket.">
  <meta property="og:title" content="Event Details — Live">
  <meta property="og:description" content="View event details, schedule, venue, and register for your QR ticket.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="/web/assets/css/main.css">
  <style>
    .cover-banner {
      width: 100%;
      aspect-ratio: 1.8 / 1;
      border-radius: 12px;
      overflow: hidden;
      background: #e8f3ef;
    }
    .cover-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .event-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "cover" "sidebar" "content";
      gap: 20px;
      align-items: start;
    }
    .cover-banner { grid-area: cover; }
    .event-sidebar { grid-area: sidebar; background: #f7f7f8; border: 0; }
    .event-sidebar h1 { margin: 0; font-size: 1.5rem; line-height: 1.25; }
    .event-meta { color: var(--text-muted); font-size: 0.875rem; }
    .event-meta span { color: var(--text-muted); }
    .event-capacity { font-size: 0.8125rem; }
    .event-secondary-actions { margin-top: 2px; }
    .event-content { grid-area: content; gap: 24px; }
    .event-about h2, .event-details h2 { margin: 0; font-size: 1.125rem; }
    .event-about p { margin: 0; line-height: 1.65; }
    .event-details { gap: 12px; }
    .event-details > div { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; font-size: 0.875rem; }
    .event-details > div span { color: var(--text-muted); }
    .event-primary-action { grid-area: action; }
    @media (min-width: 900px) {
      .event-layout {
        grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr);
        grid-template-areas: "cover sidebar" "content sidebar";
      }
      .event-sidebar { position: sticky; top: 84px; }
    }
    @media (max-width: 899px) {
      .cover-banner { aspect-ratio: 1.1 / 1; }
      .event-primary-action {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 45;
        padding: 12px 24px calc(12px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--border);
        background: #fff;
      }
      .has-event-action.has-mobile-nav { padding-bottom: 154px; }
    }
    .progress-track {
      height: 8px;
      background: var(--surface-subtle);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }
    .event-map {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-subtle);
    }
    .event-map iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main class="container stack-lg" style="padding-top:24px;padding-bottom:48px;">
    <div>
      <a href="/" class="muted" style="font-weight:500;">‹ All events</a>
    </div>
    <div id="event-root" aria-live="polite"></div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="/web/assets/js/pages/event.js"></script>
</body>
</html>
