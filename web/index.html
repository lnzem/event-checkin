<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regismeow</title>
  <link rel="icon" type="image/svg+xml" href="/web/assets/icons/regismeow-favicon.svg">
  <meta name="description" content="Find upcoming seminars, talks, and workshops with Regismeow.">
  <meta property="og:title" content="Home — Regismeow">
  <meta property="og:description" content="Find upcoming seminars, talks, and workshops with Regismeow.">
  <meta property="og:type" content="website">
  <script src="/web/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/web/assets/css/main.css">
  <style>
    .home-page { padding-top: 40px; padding-bottom: 64px; gap: 40px; }
    .home-intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; }
    .home-intro h1 { margin: 0 0 8px; font-size: clamp(1.75rem, 4vw, 2.5rem); }
    .home-intro p { margin: 0; color: var(--text-muted); }
    .home-intro-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .home-section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    .home-section-heading h2 { margin: 0; font-size: 1.25rem; }
    .home-section-heading a { font-size: 0.875rem; font-weight: 600; }
    @media (max-width: 640px) {
      .home-page { padding-top: 28px; gap: 30px; }
      .home-intro { align-items: flex-start; flex-direction: column; gap: 18px; }
      .home-intro-actions { width: 100%; }
    }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main class="container home-page stack-lg">
    <section class="home-intro">
      <div>
        <h1>Find your next event</h1>
        <p>Seminars, talks, and workshops coming up.</p>
      </div>
      <div class="home-intro-actions">
        <a class="btn btn-primary" href="/explore">Explore events</a>
        <a class="btn btn-secondary" href="/tickets">My tickets</a>
      </div>
    </section>

    <section class="stack" aria-labelledby="home-upcoming-heading">
      <div class="home-section-heading">
        <h2 id="home-upcoming-heading">Upcoming events</h2>
        <a href="/explore">See all events</a>
      </div>
      <div id="home-events" aria-live="polite" class="stack">
        <div class="events-grid" id="home-events-loading"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="/web/assets/js/pages/home.js"></script>
  <script type="module" src="/web/assets/js/theme.js"></script>
</body>
</html>
