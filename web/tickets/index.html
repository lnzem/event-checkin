<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tickets — Regismeow</title>
  <meta name="description" content="View your upcoming and past event tickets and QR codes.">
  <meta property="og:title" content="My Tickets — Regismeow">
  <meta property="og:description" content="View your upcoming and past event tickets and QR codes.">
  <meta property="og:type" content="website">
  <script src="/web/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/web/assets/css/main.css">
  <style>
    .ticket-card {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-4);
    }
    @media (min-width: 640px) {
      .ticket-card {
        grid-template-columns: 140px 1fr;
        align-items: start;
      }
    }
    .ticket-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: var(--surface-subtle);
    }
    .qr-modal-box {
      background: #ffffff;
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid #e2e8f0;
      display: inline-flex;
      justify-content: center;
      margin: 0 auto;
    }
    .qr-modal-box canvas, .qr-modal-box img {
      width: min(320px, 72vw);
      height: min(320px, 72vw);
      min-width: 240px;
      display: block;
    }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main class="container stack-lg" style="padding-top:32px;padding-bottom:48px;">
    <div class="stack-sm">
      <h1 style="margin:0;">My Tickets</h1>
      <p id="tickets-subtitle" class="muted" style="margin:0;"></p>
    </div>

    <div class="tabs" role="tablist" aria-label="Ticket categories">
      <button type="button" class="tab-btn" role="tab" id="tab-upcoming" data-tab="upcoming" aria-selected="true">
        Upcoming <span class="chip chip-muted" id="count-upcoming">0</span>
      </button>
      <button type="button" class="tab-btn" role="tab" id="tab-past" data-tab="past" aria-selected="false">
        Past <span class="chip chip-muted" id="count-past">0</span>
      </button>
    </div>

    <div id="tickets-panel" class="stack" aria-live="polite"></div>

  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="/web/assets/js/pages/tickets.js"></script>
  <script type="module" src="/web/assets/js/theme.js"></script>
</body>
</html>
