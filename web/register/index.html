<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Live</title>
  <meta name="description" content="Register for an event and receive your QR ticket immediately.">
  <meta property="og:title" content="Register — Live">
  <meta property="og:description" content="Register for an event and receive your QR ticket immediately.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="/web/assets/css/main.css">
  <style>
    .register-wrap {
      max-width: 560px;
      margin: 0 auto;
    }
    .qr-box {
      background: #ffffff;
      padding: 20px;
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      border: 1px solid #e2e8f0;
    }
    .qr-box img {
      width: 240px;
      height: 240px;
      display: block;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .success-animate {
      animation: popIn 0.25s ease-out;
    }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main class="container" style="padding-top:24px;padding-bottom:48px;">
    <div id="register-root" class="register-wrap stack-lg" aria-live="polite"></div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="/web/assets/js/pages/register.js"></script>
</body>
</html>
