<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regismeow</title>
  <link rel="icon" type="image/svg+xml" href="/web/assets/icons/regismeow-favicon.svg">
  <meta name="description" content="Register for an event and receive your QR ticket immediately.">
  <meta property="og:title" content="Register — Regismeow">
  <meta property="og:description" content="Register for an event and receive your QR ticket immediately.">
  <meta property="og:type" content="website">
  <script src="/web/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/web/assets/css/main.css">
  <style>
    .register-wrap {
      max-width: 460px;
      margin: 0 auto;
    }
    .qr-box {
      background: #ffffff;
      padding: 16px;
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      border: 1px solid var(--border);
    }
    .qr-box img {
      width: min(240px, calc(100vw - 88px));
      height: auto;
      aspect-ratio: 1;
      display: block;
    }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main class="container" style="padding-top:24px;padding-bottom:48px;">
    <div id="register-root" class="register-wrap stack-lg" aria-live="polite"></div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="/web/assets/js/pages/register.js"></script>
  <script type="module" src="/web/assets/js/theme.js"></script>
</body>
</html>
